<!doctype html>
<html lang="en">
<body style="margin:0;padding:0;background:#F7F6F3;font-family:Arial,Helvetica,sans-serif;color:#1B1B1F;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F7F6F3;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
        <tr><td style="padding:0 0 16px 0;font-size:24px;font-weight:700;color:#E8492F;">CampusBite</td></tr>
        <tr><td style="background:#FFFFFF;border:1px solid #E7E5E0;border-radius:12px;padding:32px 24px;">
          <p style="margin:0 0 16px 0;font-size:16px;line-height:1.5;">Hi $name,</p>
          <p style="margin:0 0 24px 0;font-size:16px;line-height:1.5;">$intro</p>
          <p style="margin:0 0 24px 0;font-family:'Courier New',Courier,monospace;font-size:32px;font-weight:700;letter-spacing:6px;color:#1B1B1F;">$code</p>
          <p style="margin:0 0 8px 0;font-size:14px;line-height:1.5;color:#3A3A42;">$outro</p>
          $extra_html
          <p style="margin:24px 0 0 0;font-size:14px;line-height:1.5;color:#3A3A42;">&mdash; Team CampusBite</p>
        </td></tr>
        <tr><td style="padding:16px 0 0 0;font-size:12px;line-height:1.5;color:#6B6B76;">
          You received this email because this address was used on CampusBite ($frontend_url).
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
